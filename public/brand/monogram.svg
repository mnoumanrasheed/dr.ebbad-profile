<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D8DBE0" />
      <stop offset="80%" stop-color="#9FA4AC" />
      <stop offset="100%" stop-color="#6F737B" />
    </linearGradient>
    <linearGradient id="accentPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#C1C5CC" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Architectural Ring / Frame -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="#0C0E12" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  <rect x="7" y="7" width="86" height="86" rx="16" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>

  <!-- Precision Medical Coordinate Marks -->
  <line x1="50" y1="3" x2="50" y2="9" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="50" y1="91" x2="50" y2="97" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="3" y1="50" x2="9" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="91" y1="50" x2="97" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Architectural 'E' Stem and Bars -->
  <path d="M28 26 V74 M28 26 H46 M28 50 H42 M28 74 H46" 
        stroke="url(#silverGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Architectural 'N' Stem and Diagonal -->
  <path d="M54 74 V26 L74 74 V26" 
        stroke="url(#silverGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Subtle Surgical Pulse Line traversing horizontally -->
  <path d="M14 62 H38 L43 57 L47 67 L51 53 L55 62 H86" 
        stroke="url(#accentPulse)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Precision focal nodes -->
  <circle cx="51" cy="53" r="1.5" fill="#FFFFFF" />
  <circle cx="86" cy="62" r="1.2" fill="#C1C5CC" />
</svg>
