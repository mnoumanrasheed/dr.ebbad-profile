<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="48%" stop-color="#E8C66B" />
      <stop offset="100%" stop-color="#B77A21" />
    </linearGradient>
    <linearGradient id="accentPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B77A21" />
      <stop offset="45%" stop-color="#FFF1B8" />
      <stop offset="100%" stop-color="#D7A845" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Architectural 'E' Stem and Bars -->
  <path d="M28 26 V74 M28 26 H46 M28 50 H42 M28 74 H46" 
        stroke="url(#goldGrad)"
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Architectural 'N' Stem and Diagonal -->
  <path d="M54 74 V26 L74 74 V26" 
        stroke="url(#goldGrad)"
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Subtle Surgical Pulse Line traversing horizontally -->
  <path d="M14 62 H38 L43 57 L47 67 L51 53 L55 62 H86" 
        stroke="url(#accentPulse)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Precision focal nodes -->
  <circle cx="51" cy="53" r="1.5" fill="#FFF1B8" />
  <circle cx="86" cy="62" r="1.2" fill="#E8C66B" />
</svg>
