<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <defs>
    <linearGradient id="logoDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090B" />
      <stop offset="100%" stop-color="#2D3139" />
    </linearGradient>
  </defs>

  <!-- Left Monogram Icon -->
  <g transform="translate(6, 6) scale(0.48)">
    <rect x="2" y="2" width="96" height="96" rx="20" fill="#E8E7E2" stroke="rgba(0,0,0,0.14)" stroke-width="1.8"/>
    
    <!-- E -->
    <path d="M28 26 V74 M28 26 H46 M28 50 H42 M28 74 H46" 
